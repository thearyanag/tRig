[package]
name = "trig-wallet-transfers"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
curve25519-dalek = "=4.1.3"
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
solana-hash = "=3.0.0"
solana-instruction = "=3.5.1"
solana-message = { version = "=3.0.1", features = ["bincode"] }
solana-pubkey = { version = "=3.0.0", features = ["sha2"] }
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
