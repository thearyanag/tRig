[package]
name = "trig-wallet-swap-policy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "=0.22.1"
bincode = "=1.3.3"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
solana-message = { version = "=3.0.1", features = ["bincode"] }
solana-signature = { version = "=3.1.0", features = ["verify"] }
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-transaction = { version = "=3.0.1", features = ["serde"] }
trig-wallet-transfers = { path = "../wallet-transfers" }
