[package]
name = "trig-wallet-signer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "=0.22.1"
bincode = "=1.3.3"
bip32 = "=0.5.3"
bip39 = { version = "=2.2.2", features = ["rand", "zeroize"] }
bs58 = "=0.5.1"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
ed25519-dalek-bip32 = "=0.3.0"
hex = "=0.4.3"
k256 = "=0.13.4"
num-bigint = "=0.4.8"
rlp = "=0.6.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha3 = "=0.10.8"
sha2 = "=0.10.9"
solana-hash = "=3.0.0"
solana-message = { version = "=3.0.1", features = ["bincode"] }
solana-pubkey = "=3.0.0"
solana-signature = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-transaction = { version = "=3.0.1", features = ["serde"] }
trig-wallet-swap-policy = { path = "../wallet-swap-policy" }
trig-wallet-transfers = { path = "../wallet-transfers" }
zeroize = { version = "=1.8.2", features = ["derive"] }

[dev-dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
