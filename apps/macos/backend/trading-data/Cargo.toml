[package]
name = "trading-data-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.8.8"
bs58 = "=0.5.1"
libc = "=0.2.190"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-http = { version = "=0.6.11", features = ["fs"] }
